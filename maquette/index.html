function readImage(file,cb){if(!file)return;if(!file.type.startsWith('image/')){toast('Choisissez une image.');return}const r=new FileReader();r.onload=()=>cb(r.result);r.onerror=()=>toast('Impossible de lire cette image.');r.readAsDataURL(file)}

function ideaForm(){const original=draft.editId?state.ideas.find(i=>i.id===draft.editId):null,foreign=original&&original.owner!==user;sheet(`<h2>${original?'Modifier l’idée':'Une nouvelle idée'}</h2><div class="tabs"><button class="chip ${formMode==='manual'?'active':''}" data-mode="manual">À la main</button><button class="chip ${formMode==='link'?'active':''}" data-mode="link">Un lien</button></div>${formMode==='link'?`<div class="banner"><label class="field" for="fetchUrl">D’abord, le lien</label><input type="url" id="fetchUrl" class="input" value="${esc(draft.url)}"><button class="btn full" id="fetchDetails">Récupérer les détails</button><button class="text-btn" id="exampleLink">Essayer un exemple</button><p id="fetchStatus" class="hint">Récupération simulée dans la maquette.</p></div>`:''}<form id="ideaForm"><label class="field" for="title">L’idée cadeau *</label><input class="input" id="title" required maxlength="120" value="${esc(draft.title)}" placeholder="Un atelier de céramique"><label class="field" for="productUrl">Lien du produit / de l’activité</label><input class="input" type="url" id="productUrl" value="${esc(draft.url)}"><fieldset><legend>Pour qui pourrait-elle convenir ?</legend><div class="choices">${checkboxes('recipients',state.people,draft.recipients||[])}</div><button type="button" class="text-btn" id="newPerson">＋ Ajouter une personne</button></fieldset><fieldset><legend>Dans quelles listes ?</legend><div class="choices">${checkboxes('lists',activeLists().map(l=>l.name),draft.lists||[])}</div><label class="choice"><input type="checkbox" id="globalIdea" ${draft.globalIdea?'checked':''}> ✨ Toutes les listes</label><button type="button" class="text-btn" id="newList">＋ Créer une liste</button></fieldset><div class="row"><label class="field">Prix / minimum (€)<input class="input" id="price" type="number" min="0" step="0.01" value="${draft.price??''}"></label><label class="field">Maximum (€)<input class="input" id="priceMax" type="number" min="0" ste for="specifications">Précisions publiques : taille, couleur, modèle…</label><textarea class="input" id="specifications">${esc(draft.specifications)}</textarea><label class="field" for="privateNote">Note de gestion · invisible aux invités</label><textarea class="input" id="privateNote">${esc(draft.privateNote)}</textarea></details>${original&&isReserved(original)?'<div class="banner">Cette idée est réservée. Un changement important préparera un email pour le réservant (simulation).</div>':''}<div class="form-footer"><span class="hint" id="draftStatus">Brouillon enregistré automatiquement</span><button class="btn" id="saveIdea">${original?'Enregistrer les modifications':'Enregistrer l’idée'}</button></div></form>`);
$('ideaForm').oninput=saveDraftForm;$('ideaForm').onchange=()=>{saveDraftForm();refreshPublication()};$('ideaForm').onsubmit=e=>{e.preventDefault();saveDraftForm();saveIdea()};document.querySelectorAll('[name="recipients"]').forEach(c=>c.onchange=()=>{if(c.checked)document.querySelectorAll('[name="recipients"]').forEach(other=>{if(c.value==='Commun'&&other.value!=='Commun'||c.value!=='Commun'&&other.value==='Commun')other.checked=false});saveDraftForm();const chosen=$('chosenPerson');chosen.innerHTML='<option value="">Pas encore décidé</option>'+options(draft.recipients,draft.chosenPerson);if(draft.recipients.length===1)chosen.value=draft.recipients[0];saveDraftForm();refreshPublication()});for(const id of ['photo','camera'])$(id).onchange=e=>readImage(e.target.files[0],image=>{draft.image=image;storeDraft();$('imagePreview').innerHTML=`<img class="image-preview" src="${esc(image)}" alt="Image choisie">`});$('unsplash').onclick=illustrations;$('newPerson').onclick=()=>inlineCreate('person');$('newList').onclick=()=>inlineCreate('list');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{saveDraftForm();formMode=b.dataset.mode;ideaForm()});if($('fetchDetails')){$('fetchDetails').onclick=fetchDetails;$('exampleLink').onclick=()=>{$('fetchUrl').value='https://example.com/cafetiere';fetchDetails()}}refreshPublication()}
function saveDraftForm(){if(!$('ideaForm')||!draft)return;for(const k of ['title','note','privateNote','specifications','priority','visibility','chosenPerson'])draft[k]=$(k).value;draft.url=$('productUrl').value;draft.price=$('price').value===''?null:Number($('price').value);draft.priceMax=$('priceMax').value===''?null:Number($('priceMax').value);draft.recipients=[...document.querySelectorAll('[name="recipients"]:checked')].map(c=>c.value);draft.lists=[...document.querySelectorAll('[name="lists"]:checked')].map(c=>c.value);draft.globalIdea=$('globalIdea').checked;if(!draft.recipients.includes(draft.chosenPerson))draft.chosenPerson='';storeDraft();$('draftStatus').textContent='Brouillon enregistré à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function refreshPublication(){if(!$('publicationSummary'))return;const lists=activeLists().filter(l=>belongs(draft,l));$('publicationSummary').innerHTML=draft.visibility==='partageable'?`<div class="banner">Visible aux invités dans : ${esc(lists.map(l=>l.title).join(', ')||'aucune liste pour le moment')}. Les liens déjà partagés afficheront ces changements dans l’application finale.</div>`:'<p class="hint">Cette idée ne sera pas visible aux invités.</p>'}
async function fetchDetails(){const url=$('fetchUrl').value;if(!safeUrl(url)){toast('Saisissez un lien http ou https.');return}$('fetchStatus').textContent='Recherche des détails…';$('fetchDetails').disabled=true;await new Promise(r=>setTimeout(r,350));if(!$('fetchStatus'))return;draft.url=url;if(url==='https://example.com/cafetiere'){draft.title='Cafetière italienne';draft.price=89;draft.image=cover('☕','#ffd0e7');draft.note='Informations d’exemple à vérifier.'}storeDraft();formMode='manual';ideaForm();toast(url.includes('example.com')?'Détails d’exemple préremplis.':'Lien conservé. Complétez les détails à la main.')}

function saveIdea(){const old=draft.editId?state.ideas.find(i=>i.id===draft.editId):null;if(old&&old.visibility==='privée'&&old.owner!==user){toast('Vous ne pouvez pas modifier cette idée privée.');return}if(old&&old.owner!==user&&draft.visibility==='privée'){toast('Seul le créateur peut rendre cette idée privée.');return}if(!draft.title.trim()){toast('Ajoutez un titre.');return}if(draft.priceMax!=null&&(draft.price==null||draft.priceMax<draft.price)){toast('Le maximum doit être supérieur ou égal au minimum.');return}if(draft.visibility==='partageable'&&(!draft.chosenPerson||!draft.recipients.includes(draft.chosenPerson))){toast('Choisissez à qui proposer ce cadeau avant de le rendre public.');$('chosenPerson')?.focus();return}const important=old&&['title','url','price','priceMax','specifications','visibility','chosenPerson'].some(k=>old[k]!==draft[k]);const changes=old?['title','url','price','priceMax','priority','visibility','recipients','lists','chosenPerson','note','specifications','privateNote'].filter(k=>JSON.stringify(old[k])!==JSON.stringify(draft[k])).map(k=>`${({title:'Titre',price:'Prix',priceMax:'Prix maximum',visibility:'Visibilité',recipients:'Destinataires possibles',lists:'Listes',chosenPerson:'Destinataire choisi',privateNote:'Note de gestion'}[k]||k)} : ${formatValue(k,old[k])} → ${formatValue(k,draft[k])}`):[];checkpoint();const data=copy(draft);delete data.editId;const idea=old?Object.assign(old,data,{owner:old.owner}):{id:uid(),emoji:'🎁',color:'sage',history:[],...data,owner:user};if(!old)state.ideas.unshift(idea);log(old?(changes.length?changes.join(' ; '):'Idée enregistrée sans changement'):'Idée créée',idea);if(important)notifyChange(idea);clearDraft();modal.innerHTML='';document.querySelector('.phone').inert=false;persist();render();if(focusReturn?.isConnected)focusReturn.focus();else if(focusReturnSelector)document.querySelector(focusReturnSelector)?.focus();toast(old?'Modifications enregistrées.':'Idée enregistrée.')}
function formatValue(key,value){if(key==='visibility')return({partageable:'Public',commune:'Nous deux',privée:'Moi uniquement'}[value]||'—');if(key==='privateNote')return value?'Renseignée':'Vide';if(Array.isArray(value))return value.join(', ')||'—';return value==null||value===''?'—':String(value)}
function detail(id){const i=(guestOnly?state.ideas:visible()).find(i=>i.id===id);if(!i)return;const guest=page==='guest',full=i.collective&&(i.contributed||0)>=(i.price||Infinity);sheet(`<div class="detail-layout"><div class="art detail-art ${i.color||'sage'}">${i.image?`<img src="${esc(i.image)}" alt="">`:i.emoji||'🎁'}</div><div><div class="eyebrow">${i.visibility==='privée'?'🔒 Confidentiel · '+i.owner:'Pour : '+esc(i.chosenPerson||'À définir')}</div><h2>${esc(i.title)}</h2><div class="amount">${price(i)}</div><span class="priority-badge">${priorityLabel(i.priority)}</span><p>${esc(i.note)}</p>${i.specifications?`<div class="banner"><strong>Précisions publiques</strong><br>${esc(i.specifications)}</div>`:''}${safeUrl(i.url)?`<a class="btn secondary full product-link" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">Voir le produit / l’activité ↗</a>`:''}${i.imageSource?`<p class="hint">${esc(i.imageSource)}</p>`:''}${i.collective?`<div class="banner">À plusieurs · ${money(i.contributed||0)} sur ${money(i.price)}<div class="progress"><span style="width:${Math.min(100,100*(i.contributed||0)/(i.price||1))}%"></span></div>${full?'Budget atteint. Les participations sont fermées.':'Il reste '+money(Math.max(0,i.price-(i.contributed||0)))}</div>`:''}${guest?isReserved(i)?'<div class="banner">Ce cadeau est déjà réservé.</div>':`<button class="btn full" id="reserve">${i.collective?'Participer':'Réserver ce cadeau'}</button>`:`${i.privateNote?`<div class="banner"><strong>Note de gestion · non partagée</strong><br>${esc(i.privateNote)}</div>`:''}<p class="hint">Possibles : ${esc(i.recipients.join(', ')||'À définir')} · choisi : ${esc(i.chosenPerson||'À décider')}</p>${i.archived?`<p>Archive : ${esc(i.archived)} · ${esc(i.date||'')}</p><button class="btn full" id="restoreIdea">Restaurer sans réservation</button>`:'<button class="btn full" id="editIdea">Modifier l’idée</button><button class="text-btn" id="archiveIdea">Archiver</button>'}${isReserved(i)||i.contributed?'<button class="btn secondary full" id="resetReservation">Remettre disponible</button><button class="text-btn" id="revealReservation">Qui a réservé ? Retourner la carte</button><div class="reservation-back" id="reservationBack" hidden></div>':''}${page==='list'?'<button class="text-btn" id="removeFromList">Retirer de cette liste</button>':''}<button class="text-btn" id="ideaHistory">Historique des modifications</button><button class="text-btn" id="reuseIdea">Réutiliser dans une nouvelle liste</button>`}</div></div>`);if($('reserve'))$('reserve').onclick=()=>reservation(i);if($('editIdea'))$('editIdea').onclick=()=>editIdea(i);if($('archiveIdea'))$('archiveIdea').onclick=()=>archiveIdea(i);if($('restoreIdea'))$('restoreIdea').onclick=()=>{checkpoint();i.archived=null;clearReservation(i);log('Idée restaurée sans réservation',i);persist();close();render()};if($('resetReservation'))$('resetReservation').onclick=()=>resetReservation(i);if($('revealReservation'))$('revealReservation').onclick=()=>{const back=$('reservationBack');back.hidden=!back.hidden;back.textContent='Réservé par '+(i.collective?(i.participants||[]).join(', '):i.who||'Un proche');$('revealReservation').textContent=back.hidden?'Qui a réservé ? Retourner la carte':'Masquer le nom'};if($('ideaHistory'))$('ideaHistory').onclick=()=>history(i);if($('reuseIdea'))$('reuseIdea').onclick=()=>reuseIdea(i);if($('removeFromList'))$('removeFromList').onclick=()=>{if(i.globalIdea){toast('Désactivez Toutes les listes dans la fiche avant de retirer cette idée.');return}sheet('<h2>Retirer de cette liste ?</h2><p>L’idée restera dans votre carnet et ses autres listes.</p><button class="btn" id="confirmRemove">Retirer</button>');$('confirmRemove').onclick=()=>{checkpoint();i.lists=i.lists.filter(n=>n!==getList(selectedList).name);log('Retirée de la liste '+getList(selectedList).title,i);persist();close();render()}}}
function editIdea(i){const saved=getDraft();const start=()=>{draft=copy(i);draft.editId=i.id;formMode='manual';ideaForm()};if(saved&&saved.editId!==i.id){sheet('<h2>Un autre brouillon existe.</h2><p>Remplacer ce brouillon pour modifier cette idée ?</p><button class="btn" id="replaceForEdit">Remplacer et modifier</button><button class="btn secondary" id="resumeForEdit">Reprendre le brouillon</button>');$('replaceForEdit').onclick=start;$('resumeForEdit').onclick=()=>{draft=saved;ideaForm()}}else{draft=saved?.editId===i.id?saved:copy(i);draft.editId=i.id;formMode='manual';ideaForm()}}

function archiveIdea(i){sheet(`<h2>Archiver cette idée</h2><p>Elle sera conservée avec son motif, mais retirée des listes actives.${isReserved(i)?' Elle est réservée : un email de changement sera préparé.':''}</p><form id="archiveForm"><label class="field" for="reason">Motif</label><select class="input" id="reason">${options(['Offert','Abandonné','Indisponible','Autre motif'],'Abandonné')}</select><label class="field" for="archiveNote">Précision</label><textarea class="input" id="archiveNote"></textarea><button class="btn full">Archiver</button></form>`);$('archiveForm').onsubmit=e=>{e.preventDefault();if($('reason').value==='Autre motif'&&!$('archiveNote').value.trim()){toast('Précisez le motif.');return}checkpoint();notifyChange(i);i.archived=$('reason').value;i.archiveNote=$('archiveNote').value;i.date=new Date().toLocaleDateString('fr-FR');log('Archivée : '+i.archived,i);persist();close();render()}}
function reservation(i){if(isReserved(i)){toast('Ce cadeau n’est plus disponible.');return}if(!i.chosenPerson){toast('Le gestionnaire doit d’abord préciser le destinataire.');return}sheet(`<h2>Réserver pour ${esc(i.chosenPerson)}</h2><div class="banner"><strong>${esc(i.title)}</strong><br>${price(i)}<br>${esc(i.specifications||'Aucune précision particulière')}</div><form id="reservationForm"><label class="field" for="guestName">Votre nom ou celui de votre famille *</label><input class="input" id="guestName" required placeholder="Sophie et Marc"><label class="field" for="guestEmail">Votre email *</label><input class="input" id="guestEmail" type="email" required placeholder="famille@exemple.fr">${i.collective?`<label class="field" for="amount">Participation prévue (€)</label><input class="input" id="amount" type="number" min="1" max="${i.price-(i.contributed||0)}" required><p class="hint">Sans paiement. Il reste ${money(i.price-(i.contributed||0))}.</p>`:''}<p class="hint">Réservation immédiate, sans compte, sans validation ni expiration. Dans l’application, un email vous donnera votre récapitulatif et le lien d’annulation.</p><button class="btn full">${i.collective?'Confirmer ma participation':'Confirmer ma réservation'}</button></form>`);$('reservationForm').onsubmit=e=>{e.preventDefault();if(isReserved(i)){toast('Ce cadeau vient d’être réservé.');return}const name=$('guestName').value.trim(),email=$('guestEmail').value,amount=i.collective?Number($('amount').value):0;if(!name)return;if(i.collective&&(amount<=0||amount>i.price-(i.contributed||0))){toast('Vérifiez le montant restant.');return}if(i.collective){i.contributed=(i.contributed||0)+amount;i.participants??=[];i.participants.push(name)}else{i.reserved=true;i.who=name;i.email=email}notification('Réservation reçue · '+i.title,i);persist();render();sheet(`<h2>C’est réservé !</h2><p>${esc(name)}, votre ${i.collective?'participation':'réservation'} est enregistrée pour ${esc(i.chosenPerson)}.</p><div class="banner">Maquette : aucun email envoyé. La réservation est immédiate ; aucun clic de validation n’est demandé.</div><button class="btn full" id="returnGuest">Retour à la liste</button><button class="text-btn" id="cancelReservation">Annuler mon choix</button>`);$('returnGuest').onclick=close;$('cancelReservation').onclick=()=>{if(i.collective){i.contributed-=amount;const idx=i.participants.lastIndexOf(name);if(idx>=0)i.participants.splice(idx,1)}else clearReservation(i);persist();close();render();toast('Votre choix est annulé.')};}}
function renderGuest(){const l=getList(selectedList);if(!l||l.archived){app.innerHTML='<h1>Liste archivée</h1><p>Cette sélection n’est plus proposée.</p>';return}app.innerHTML=`${!guestOnly?'<button class="back" id="exitGuest">← Retour à la liste gestionnaire</button>':''}<div class="guest-heading"><div><div class="eyebrow">Kad’Humbert · une liste pour vous</div><h1>${esc(l.title)}</h1><p>${esc(l.slogan)}</p></div>${l.image?`<img class="list-cover" src="${esc(l.image)}" alt="Illustration de la liste">`:''}</div>${filterUI(true)}<div id="results"></div><footer>Ce lien donne uniquement accès à cette liste. Aucun compte ni installation requis.</footer>`;if($('exitGuest'))$('exitGuest').onclick=()=>go('list');bindFilters();results()}
function publicIdea(i){const {privateNote,history,owner,who,email,participants,...out}=i;out.recipients=i.chosenPerson?[i.chosenPerson]:[];out.participants=[];return out}
function shareList(id){const l=getList(id),data=visible().filter(i=>!i.archived&&i.visibility==='partageable'&&belongs(i,l)),unassigned=data.filter(i=>!i.chosenPerson);if(unassigned.length){toast('Attribuez un destinataire aux idées publiques avant de partager.');return}const payload={list:copy(l),ideas:data.map(publicIdea)},url=location.href.split('#')[0]+'#liste='+encodeURIComponent(JSON.stringify(payload));sheet(`<h2>Partager « ${esc(l.title)} »</h2><p>${data.length} cadeaux publics. Vos notes de gestion et idées privées sont exclues.</p><input class="input" id="shareUrl" readonly value="${esc(url)}" aria-label="Lien de partage"><button class="btn full" id="copyLink">Copier le lien</button><button class="btn secondary full" id="sendLink">Envoyer le lien…</button><button class="text-btn" id="previewGuest">Prévisualiser la liste invitée</button><p class="hint">Lien de maquette : un fichier local n’est pas une adresse publique. Réservations et emails ne sont pas synchronisés entre appareils.</p>`);$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Lien copié.')}catch{$('shareUrl').focus();$('shareUrl').select();toast('Copiez le lien sélectionné.')}};$('previewGuest').onclick=()=>{close();selectedList=id;go('guest')};$('sendLink').onclick=()=>sendLink(l,url)}
function sendLink(l,url){sheet('<h2>Inviter un proche</h2><form id="contactForm"><label class="field" for="contactName">Nom du contact *</label><input class="input" id="contactName" required><button class="btn full">Choisir le canal</button></form>');$('contactForm').onsubmit=e=>{e.preventDefault();const name=$('contactName').value.trim();sheet(`<h2>Inviter ${esc(name)}</h2><label class="field" for="contactAddress">Numéro ou email (facultatif)</label><input class="input" id="contactAddress"><div class="choices">${['WhatsApp','Gmail','SMS'].map(c=>`<button class="btn" data-channel="${c}">${c}</button>`).join('')}</div><p class="hint">Le message sera préparé, vous choisirez de l’envoyer.</p>`);document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{const channel=b.dataset.channel,address=$('contactAddress').value,text=`Coucou ${name} ! Je t’invite à voir la liste « ${l.title} » sur Kad’Humbert 🎁 Tu peux réserver une idée pour éviter les doublons : ${url}`;let target=channel==='WhatsApp'?'https://wa.me/'+address.replace(/\D/g,'')+'?text='+encodeURIComponent(text):channel==='Gmail'?'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(address)+'&su='+encodeURIComponent(l.title)+'&body='+encodeURIComponent(text):'sms:'+address.replace(/[^+0-9]/g,'')+'?body='+encodeURIComponent(text);state.shares.unshift({list:l.id,name,channel,date:new Date().toLocaleString('fr-FR'),status:'Partage préparé'});persist();window.open(target,'_blank','noopener,noreferrer');close();toast('Partage préparé, pas encore confirmé envoyé.')})}}
function listMenu(){const l=getList(selectedList);sheet(`<h2>Actions de la liste</h2><button class="btn full" id="customizeList">Personnaliser</button><button class="btn secondary full" id="duplicateList">Dupliquer pour une nouvelle édition</button><button class="text-btn" id="archiveList">Archiver la liste</button><h3>Historique des partages</h3>${state.shares.filter(s=>s.list===l.id).map(s=>`<p>${esc(s.name)} · ${s.channel} · ${s.status}</p>`).join('')||'<p>Aucun partage préparé.</p>'}`);$('customizeList').onclick=()=>customizeList(l);$('duplicateList').onclick=()=>duplicateList(l);$('archiveList').onclick=()=>{sheet('<h2>Archiver la liste ?</h2><p>Ses idées restent dans votre carnet. La page invitée sera indiquée comme archivée dans l’application finale.</p><button class="btn" id="confirmArchiveList">Archiver</button>');$('confirmArchiveList').onclick=()=>{checkpoint();l.archived=true;l.archiveDate=new Date().toLocaleDateString('fr-FR');log('Liste archivée : '+l.title);persist();close();archiveTab='lists';go('archives')}}}
function customizeList(l){sheet(`<h2>Personnaliser la liste</h2><form id="listForm"><label class="field" for="listTitle">Titre</label><input class="input" id="listTitle" value="${esc(l.title)}"><label class="field" for="listSlogan">Message d’accueil</label><textarea class="input" id="listSlogan">${esc(l.slogan)}</textarea><label class="upload">Photo de couverture<input type="file" accept="image/*" id="listPhoto"></label><div id="coverPreview">${l.image?`<img class="image-preview" src="${esc(l.image)}" alt="Couverture">`:''}</div><button type="button" class="text-btn" id="removeCover">Retirer la couverture</button><button class="btn full">Enregistrer</button></form>`);let image=l.image;$('listPhoto').onchange=e=>readImage(e.target.files[0],src=>{image=src;$('coverPreview').innerHTML=`<img class="image-preview" src="${esc(src)}" alt="Couverture">`});$('removeCover').onclick=()=>{image='';$('coverPreview').innerHTML=''};$('listForm').onsubmit=e=>{e.preventDefault();checkpoint();l.title=$('listTitle').value.trim()||l.name;l.slogan=$('listSlogan').value;l.image=image;log('Liste personnalisée : '+l.title);persist();close();render()}}
function createEntity(){const kind=page==='people'?'person':'list';sheet(`<h2>${kind==='person'?'Ajouter une personne':'Créer une liste'}</h2><form id="entityForm"><label class="field" for="entityName">Nom</label><input class="input" id="entityName" required><button class="btn full">Créer</button></form>`);$('entityForm').onsubmit=e=>{e.preventDefault();const name=$('entityName').value.trim();if(!name)return;const exists=kind==='person'?state.people.some(p=>norm(p)===norm(name)):state.lists.some(l=>norm(l.name)===norm(name));if(exists){toast('Ce nom existe déjà.');return}checkpoint();if(kind==='person')state.people.push(name);else{const l={id:String(uid()),name,title:name,slogan:'',image:''};state.lists.push(l);selectedList=l.id}persist();close();if(kind==='list'){go('list');customizeList(getList(selectedList))}else render()}}
function listArchives(){const data=state.lists.filter(l=>l.archived&&norm(l.title).includes(norm(filters().q)));$('results').innerHTML=data.map(l=>`<article class="entity-card"><h2>${esc(l.title)}</h2><p>Archivée le ${esc(l.archiveDate)}</p><button class="btn" data-restorelist="${l.id}">Restaurer la liste</button></article>`).join('')||'<div class="empty">Aucune liste archivée.</div>';document.querySelectorAll('[data-restorelist]').forEach(b=>b.onclick=()=>{checkpoint();getList(b.dataset.restorelist).archived=false;log('Liste restaurée : '+getList(b.dataset.restorelist).title);persist();render()})}
function duplicateList(l){const ideas=visible().filter(i=>!i.archived&&belongs(i,l));sheet(`<h2>Nouvelle édition</h2><form id="duplicateForm"><label class="field" for="duplicateName">Nom de la nouvelle liste</label><input class="input" id="duplicateName" required value="${esc(l.title+' — nouvelle édition')}"><p>Chaque idée reprise aura une proposition indépendante, sans réservation.</p>${ideas.map(i=>`<label class="choice block"><input type="checkbox" name="reuse" value="${i.id}" checked> ${esc(i.title)}</label>`).join('')}<button class="btn full">Créer la liste</button></form>`);$('duplicateForm').onsubmit=e=>{e.preventDefault();const name=$('duplicateName').value.trim();if(!name||state.lists.some(l=>norm(l.name)===norm(name))){toast('Choisissez un nouveau nom.');return}checkpoint();const target={...copy(l),id:String(uid()),name,title:name,archived:false};state.lists.push(target);const ids=[...document.querySelectorAll('[name="reuse"]:checked')].map(c=>Number(c.value));ideas.filter(i=>ids.includes(i.id)).forEach(i=>{const n={...copy(i),id:uid(),lists:[name],globalIdea:false,archived:null};clearReservation(n);state.ideas.unshift(n);log('Nouvelle proposition depuis '+l.title,n)});persist();close();selectedList=target.id;go('list')};}
function reuseIdea(i){sheet(`<h2>Nouvelle proposition</h2><form id="reuseForm"><label class="field" for="reuseList">Liste</label><select class="input" id="reuseList">${activeLists().map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select><label class="field" for="reusePerson">Destinataire choisi</label><select class="input" id="reusePerson">${options(state.people,i.chosenPerson)}</select><p>L’original reste conservé. La nouvelle proposition ne reprend aucune réservation.</p><button class="btn full">Créer la proposition</button></form>`);$('reuseForm').onsubmit=e=>{e.preventDefault();const l=getList($('reuseList').value);if(!l)return;checkpoint();const n={...copy(i),id:uid(),lists:[l.name],chosenPerson:$('reusePerson').value,archived:null,globalIdea:false};n.recipients=[...new Set([...n.recipients,n.chosenPerson])];if(n.chosenPerson==='Commun')n.recipients=['Commun'];else n.recipients=n.recipients.filter(p=>p!=='Commun');clearReservation(n);state.ideas.unshift(n);log('Nouvelle proposition pour '+n.chosenPerson,n);persist();close();selectedList=l.id;go('list')};}
function saveFilter(){sheet('<h2>Enregistrer cette recherche</h2><form id="saveFilterForm"><label class="field" for="filterName">Nom du raccourci</label><input class="input" id="filterName" required><button class="btn full">Enregistrer</button></form>');$('saveFilterForm').onsubmit=e=>{e.preventDefault();state.savedFilters.push({id:uid(),owner:user,name:$('filterName').value,filters:copy(filters())});persist();close();render()}}
function batchActions(){const chosen=visible().filter(i=>selection.has(i.id));sheet(`<h2>${chosen.length} idées sélectionnées</h2><form id="batchForm"><label class="field" for="batchKind">Action</label><select class="input" id="batchKind"><option value="list">Ajouter à une liste</option><option value="archive">Archiver</option></select><div id="batchFields"></div><button class="btn full">Appliquer à ${chosen.length} idées</button></form>`);const fields=()=>{$('batchFields').innerHTML=$('batchKind').value==='list'?`<label class="field" for="batchList">Liste</label><select class="input" id="batchList">${activeLists().map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select>`:'<label class="field" for="batchReason">Motif</label><select class="input" id="batchReason">'+options(['Abandonné','Offert','Indisponible'],'Abandonné')+'</select><p>Les idées quitteront les listes actives, mais resteront dans vos archives.</p>'};$('batchKind').onchange=fields;fields();$('batchForm').onsubmit=e=>{e.preventDefault();const kind=$('batchKind').value,value=kind==='list'?getList($('batchList').value)?.name:$('batchReason').value;if(!value)return;const perform=()=>{checkpoint();chosen.forEach(i=>{if(kind==='list')i.lists=[...new Set([...i.lists,value])];else{notifyChange(i);i.archived=value;i.date=new Date().toLocaleDateString('fr-FR')}log(kind==='list'?'Ajoutée à '+value:'Archivée : '+value,i)});selection.clear();selectMode=false;persist();close();render();toast('Action appliquée. Annuler reste disponible.')};if(kind==='archive'){sheet(`<h2>Archiver ${chosen.length} idées ?</h2><p>Motif : ${esc(value)}. ${chosen.filter(isReserved).length} sont réservées ; un email de changement sera préparé.</p><button class="btn" id="confirmBatch">Confirmer l’archivage</button>`);$('confirmBatch').onclick=perform}else perform()}}
function history(i){const entries=(i?i.history:state.activity)||[];sheet(`<h2>Historique ${i?'de l’idée':'administrateur'}</h2>${entries.filter(e=>!e.privateOwner||e.privateOwner===user).map(e=>`<article class="entity-card"><strong>${esc(e.text)}</strong><p class="hint">${e.by} · ${e.date}</p></article>`).join('')||'<p>Aucune modification pour le moment.</p>'}`)}
function account(){const prefs=state.prefs[user];sheet(`<h2>Espace de ${user}</h2><div class="choices"><button class="btn" id="asAlex">Alex</button><button class="btn secondary" id="asElise">Elise</button></div><p class="hint">Changement de profil simulé ; ce n’est pas une authentification.</p><button class="btn secondary full" id="history">Historique des modifications</button><button class="btn secondary full" id="notifications">Réglages des notifications</button><button class="btn secondary full" id="export">Exporter mon carnet</button><button class="text-btn" id="incomingShare">Partager vers Kad’Humbert depuis le téléphone</button><h3>Notifications</h3>${state.notifications.filter(n=>!n.privateOwner||n.privateOwner===user).map(n=>`<p>${esc(n.text)}<br><small>${n.date}</small></p>`).join('')||'<p>Aucune notification.</p>'}`);for(const name of ['Alex','Elise'])$('as'+name).onclick=()=>{user=name;close();go('ideas')};$('history').onclick=()=>history();$('export').onclick=exportNotebook;$('notifications').onclick=notificationSettings;$('incomingShare').onclick=()=>sheet('<h2>Partager depuis le téléphone</h2><p>Installez le pack web sur HTTPS dans un navigateur compatible, puis choisissez Kad’Humbert dans le menu Partager d’une page produit.</p><p>Le fichier HTML local ne suffit pas pour cette fonction.</p>')}
function notificationSettings(){const prefs=state.prefs[user];sheet(`<h2>Mes notifications</h2><form id="notificationForm"><label class="choice"><input id="notifEmail" type="checkbox" ${prefs.email?'checked':''}> Email</label><label class="choice"><input id="notifApp" type="checkbox" ${prefs.inApp?'checked':''}> Dans l’application</label><label class="field" for="frequency">Fréquence des réservations</label><select class="input" id="frequency">${options(['Immédiate','Résumé quotidien','Résumé hebdomadaire'],prefs.frequency)}</select><label class="choice"><input type="checkbox" id="hideNames" ${prefs.hideNames?'checked':''}> Masquer les noms dans les notifications</label><p class="hint">Les emails sont simulés. Les réservations sont immédiates, sans validation ni expiration.</p><button class="btn full">Enregistrer</button></form>`);$('notificationForm').onsubmit=e=>{e.preventDefault();Object.assign(prefs,{email:$('notifEmail').checked,inApp:$('notifApp').checked,frequency:$('frequency').value,hideNames:$('hideNames').checked});persist();close();toast('Préférences enregistrées.')};}
function exportNotebook(){const url=URL.createObjectURL(new Blob([JSON.stringify({version:5,date:new Date().toISOString(),ideas:visible(),lists:state.lists},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Kad-Humbert-carnet.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
if(location.hash.startsWith('#liste=')){try{const data=JSON.parse(decodeURIComponent(location.hash.slice(7)));if(!data.list||!Array.isArray(data.ideas))throw Error('invalid');state={...state,ideas:data.ideas.filter(i=>!i.archived&&i.visibility==='partageable'),lists:[data.list]};guestOnly=true;selectedList=data.list.id;page='guest'}catch{toast('Lien de maquette invalide.')}}
render();
if(!guestOnly){const input=new URLSearchParams(location.search);if(input.has('url')||input.has('text')||input.has('title')){const incoming=()=>{draft={title:input.get('title')||'',url:input.get('url')||(input.get('text')||'').match(/https?:\/\/[^\s]+/)?.[0]||'',recipients:[],lists:[],visibility:'privée',priority:'Bonne idée',price:null,priceMax:null,owner:user,note:'',privateNote:'',specifications:''};storeDraft();quickForm()};if(getDraft()){sheet('<h2>Un lien reçu et un brouillon</h2><p>Conservez votre brouillon ou remplacez-le par le lien reçu.</p><button class="btn" id="incomingReplace">Remplacer par le lien</button>');$('incomingReplace').onclick=incoming}else incoming()}if('serviceWorker' in navigator&&['http:','https:'].includes(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});}

</script></body></html>
